name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: environments/requirements-current.txt
      - run: python -m pip install -r environments/requirements-current.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/web_requests.test.cjs
